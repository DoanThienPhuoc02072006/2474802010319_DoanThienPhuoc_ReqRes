name: API Automated Tests
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
      - name: Run Newman CLI
        run: |
          newman run 2474802010319_DoanThienPhuoc_ReqRes.postman_collection.json \
          -e 2474802010319_DoanThienPhuoc_ReqRes_Env.postman_environment.json \
          -d users.csv \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export report.html
      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: report.html
