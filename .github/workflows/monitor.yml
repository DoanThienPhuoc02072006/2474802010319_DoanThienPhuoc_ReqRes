name: API Monitor
on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi giờ
  workflow_dispatch:     # Cho phép kích hoạt thủ công trên GitHub Actions

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman CLI
        run: npm install -g newman

      - name: Run API Availability & SLA Monitor
        run: |
          newman run ReqRes_Monitor.postman_collection.json \
          -e 2474802010319_DoanThienPhuoc_ReqRes_Env.postman_environment.json \
          --env-var "baseUrl=https://reqres.in" \
          --env-var "apiKey=free_user_3L2ZC0PabCRj74vL26FPQ1GXNsY"
